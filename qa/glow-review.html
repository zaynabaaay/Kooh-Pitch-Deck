<!doctype html><html><head><meta charset="utf-8"><title>KOOX temporary glow verification</title><style>
html,body{margin:0;background:#17131a;color:white;font:13px Arial}header{padding:8px;display:flex;gap:8px;align-items:center}button,select{font:inherit;padding:6px}#viewport{position:relative;margin:auto}iframe{position:absolute;left:0;top:0;border:0;transform-origin:top left}#baseline{left:-10000px;position:fixed;pointer-events:none}#report{white-space:pre-wrap;max-height:130px;overflow:auto;font:11px monospace}
</style></head><body><header>
<label>Viewport <select id="size"><option value="1024,768">iPad landscape 1024×768</option><option value="1366,1024">iPad Pro 1366×1024</option><option value="768,1024">iPad portrait 768×1024</option></select></label>
<label>Slide <select id="slide"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option></select></label>
<button id="present">Present</button><button id="exit">Exit</button><button id="audit">Audit 16 slides</button>
</header><main id="viewport"><iframe id="deck" title="Candidate" src="glow-deck.html?v=feather-2"></iframe></main><iframe id="baseline" title="Original layout" src="glow-baseline.html"></iframe><pre id="report"></pre>
<script type="module">
const frame=document.getElementById('deck'),base=document.getElementById('baseline'),select=document.getElementById('slide'),report=document.getElementById('report');
const tick=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
function resize(){const[w,h]=document.getElementById('size').value.split(',').map(Number),scale=Math.min((innerWidth-16)/w,(innerHeight-110)/h,1);for(const f of[frame,base]){f.style.width=w+'px';f.style.height=h+'px';}frame.style.transform='scale('+scale+')';const box=document.getElementById('viewport');box.style.width=w*scale+'px';box.style.height=h*scale+'px';}
resize();window.addEventListener('resize',resize);document.getElementById('size').onchange=resize;
select.onchange=()=>{for(const f of[frame,base])f.contentWindow.location.hash='slide-'+select.value;};
document.getElementById('present').onclick=()=>{for(const f of[frame,base])f.contentDocument.getElementById('fullscreen').click();};
document.getElementById('exit').onclick=()=>{for(const f of[frame,base])f.contentDocument.dispatchEvent(new f.contentWindow.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));};
function data(f,n){const doc=f.contentDocument,win=f.contentWindow,s=doc.getElementById('slide-'+n),b=s.getBoundingClientRect(),video=s.querySelector('.presenter'),v=video.getBoundingClientRect(),pseudo=win.getComputedStyle(s,'::before'),texts=[...s.querySelectorAll('h1,h2,h3,p,li')].filter(el=>!el.closest('.presenter'));
const rects=texts.flatMap(el=>{const r=doc.createRange();r.selectNodeContents(el);return [...r.getClientRects()].filter(r=>r.width&&r.height);});
return{rects:rects.map(r=>[r.left-b.left,r.top-b.top,r.width,r.height]),type:texts.map(el=>{const st=win.getComputedStyle(el);return[st.fontFamily,st.fontSize,st.fontWeight,st.lineHeight,st.color,st.letterSpacing]}),shadows:[...new Set(texts.map(el=>win.getComputedStyle(el).textShadow))],gradient:pseudo.backgroundImage,glow:[parseFloat(pseudo.left),parseFloat(pseudo.top),parseFloat(pseudo.width),parseFloat(pseudo.height)],mask:pseudo.maskImage,maskRadius:parseFloat(s.style.getPropertyValue('--glow-video-radius')),circle:[v.left-b.left,v.top-b.top,v.width,v.height],overlaps:rects.some(r=>r.right>v.left&&r.left<v.right&&r.bottom>v.top&&r.top<v.bottom),clipped:rects.some(r=>r.left<b.left-1||r.right>b.right+1||r.top<b.top-1||r.bottom>b.bottom+1),scroll:doc.documentElement.scrollWidth>doc.documentElement.clientWidth,navHidden:win.getComputedStyle(doc.querySelector('.deck-nav')).display==='none'};}
document.getElementById('audit').onclick=async()=>{report.textContent='Checking…';await Promise.all([frame.contentWindow.qaPresentation.presenter.prepare(),base.contentWindow.qaPresentation.presenter.prepare(),frame.contentDocument.fonts.ready,base.contentDocument.fonts.ready]);const results=[];for(let n=1;n<=16;n++){for(const f of[frame,base])f.contentWindow.location.hash='slide-'+n;await new Promise(r=>setTimeout(r,100));await tick();base.contentWindow.qaPresentation.presenter.video.pause();const a=data(frame,n),b=data(base,n);const maxDelta=a.rects.length===b.rects.length?Math.max(0,...a.rects.flatMap((r,i)=>r.map((v,k)=>Math.abs(v-b.rects[i][k])))):999;results.push({slide:n,maxLayoutDelta:maxDelta,sameTypography:JSON.stringify(a.type)===JSON.stringify(b.type),shadows:a.shadows,gradient:a.gradient,glow:a.glow,maskRadius:a.maskRadius,circle:a.circle,overlaps:a.overlaps,clipped:a.clipped,scroll:a.scroll,navHidden:a.navHidden});}select.value='16';report.textContent=JSON.stringify({viewport:document.getElementById('size').value,results},null,2);};
</script></body></html>
